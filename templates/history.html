<!DOCTYPE html>
<html>

<head>
  <title>History</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
  <div class="container mt-4">
    <h2 class="text-center">Sensor Readings History</h2>

    <a href="/" class="btn btn-primary btn-sm mt-2">Back to Dashboard</a>

    <table class="table table-bordered table-striped mt-3">
      <thead class="table-dark">
        <tr>
          <th>Timestamp</th>
          <th>BPM</th>
          <th>SpO₂</th>
        </tr>
      </thead>

      <tbody>
        {% for ts,bpm,spo2 in rows %}
        <tr>
          <td>{{ ts }}</td>
          <td>{{ bpm }}</td>
          <td>{{ spo2 }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>

</html>
